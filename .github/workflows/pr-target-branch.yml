name: PR Target Branch Check

# Prevents feature/fix PRs from being merged into main by mistake.
# Convention: day-to-day PRs target the active development branch
# (vX.Y.Z). Only release PRs cut by maintainers from a vX.Y.Z branch
# may target main.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  check-base-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Allow release PRs (v* -> main, maintainer only)
        if: >-
          github.event.pull_request.base.ref == 'main' &&
          startsWith(github.event.pull_request.head.ref, 'v') &&
          contains(fromJSON('["zhukunpenglinyutong"]'), github.event.pull_request.user.login)
        run: echo "Release PR by maintainer — allowed."

      - name: Comment on PRs targeting main
        if: >-
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          !(startsWith(github.event.pull_request.head.ref, 'v') &&
            contains(fromJSON('["zhukunpenglinyutong"]'), github.event.pull_request.user.login))
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;

            const { data: branches } = await github.rest.repos.listBranches({
              owner, repo, per_page: 100,
            });
            const devBranches = branches
              .map((b) => b.name)
              .filter((n) => /^(feature\/)?v?\d/.test(n) && n !== 'main');
            const suggestion = devBranches[0] ??
              'the current development branch (vX.Y.Z)';

            const body = [
              '⚠️ **Wrong target branch?**',
              '',
              'This PR targets `main`, which only receives release PRs.',
              'Feature and fix PRs should target the active development branch instead.',
              '',
              `**Suggested base branch:** \`${suggestion}\``,
              '',
              'How to fix: click **Edit** at the top of this PR and change the base branch.',
              'Rebasing is usually unnecessary — GitHub retargets the PR in place.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: number, per_page: 100,
            });
            const marker = '⚠️ **Wrong target branch?**';
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: number, body,
              });
            }

      - name: Fail PRs targeting main
        if: >-
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          !(startsWith(github.event.pull_request.head.ref, 'v') &&
            contains(fromJSON('["zhukunpenglinyutong"]'), github.event.pull_request.user.login))
        run: |
          echo "::error::PRs must target the active development branch (vX.Y.Z), not main."
          exit 1
